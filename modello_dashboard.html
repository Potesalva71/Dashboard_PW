<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Twin reparto avvolgimenti</title>
<style>
:root{--bg:#fff;--fg:#1f2430;--mut:#6b7080;--card:#f4f5f8;--line:#e3e5ec;--blu:#2a78d6;--aran:#eb6834;--aq:#1baf7a;--gr:#8a8984;--ok:#e6f6ee;--okf:#14683f;--ko:#fde8e6;--kof:#a3261a;--wa:#fff6dc;--waf:#7a5a00;--in:#e8f1fc;--inf:#1b4f94}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181f;--fg:#e8eaf0;--mut:#9aa0b0;--card:#1f232d;--line:#313746;--ok:#143626;--okf:#7fe0ae;--ko:#40201d;--kof:#ffb4aa;--wa:#3d3314;--waf:#f1d27a;--in:#16283f;--inf:#9cc4f5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:18px;margin:18px 0 8px}p.sub{color:var(--mut);margin:0 0 12px;font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--blu);color:#fff;border-color:var(--blu)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.card{background:var(--card);border-radius:10px;padding:10px 12px}.card .l{font-size:12px;color:var(--mut)}.card .v{font-size:26px;font-weight:600}.card .d{font-size:12px;color:var(--mut)}
.badge{display:inline-block;color:#fff;padding:2px 10px;border-radius:10px;font-weight:600;font-size:13px}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0}.ok{background:var(--ok);color:var(--okf)}.ko{background:var(--ko);color:var(--kof)}.wa{background:var(--wa);color:var(--waf)}.in{background:var(--in);color:var(--inf)}
select,input{font:inherit;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);max-width:100%}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}.row{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.row>div{flex:1;min-width:180px}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mut);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500}
ul{margin:6px 0;padding-left:20px}.cap{font-size:12px;color:var(--mut)}.sec{display:none}.sec.on{display:block}
.leg{font-size:12px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap;margin:4px 0}.leg i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:4px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}.tabs button.on{background:var(--blu);color:#fff;border-color:var(--blu)}
details{background:var(--card);border-radius:8px;padding:8px 12px;margin:8px 0}summary{cursor:pointer;font-weight:600}img.g{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin-top:6px}
.gt td,.gt th{text-align:left;vertical-align:top}a.gl{font-size:13px;color:var(--blu);cursor:pointer;text-decoration:none}
</style></head><body><div class="wrap">
<h1>Digital Twin del reparto avvolgimenti</h1>
<p class="sub">Prototipo di supporto alle decisioni: nessun controllo automatico delle macchine. Dati reali anonimizzati (R) o simulati (S), sempre etichettati. Versione statica: stessi modelli dell'app Streamlit, risultati precalcolati.</p>
<nav id="nav"></nav>
<div id="s0" class="sec"></div><div id="s1" class="sec"></div><div id="s2" class="sec"></div><div id="s3" class="sec"></div><div id="s4" class="sec"></div><div id="s5" class="sec"></div>
</div>
<script>
const D=/*__DATA__*/null;
const G=/*__GUIDA__*/null;
const C={b:'#2a78d6',a:'#eb6834',q:'#1baf7a',g:'#8a8984'};
const $=id=>document.getElementById(id);
const sc=v=>v>1000?'> 1000':fmt(v,1);
const fmt=(v,n=1)=>Number(v).toLocaleString('it-IT',{minimumFractionDigits:n,maximumFractionDigits:n});
const badge=p=>`<span class="badge" style="background:${p==='R'?C.q:C.a}">${p==='R'?'REALE':'SIMULATO'}</span>`;
const card=(l,v,d='')=>`<div class="card"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}&nbsp;</div></div>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const names=['Stato del reparto','Ciclo di autoclave con allarme','Qualità e probabilità di conformità','Raccomandazione sul vuoto finale','Pressatura e verifica dell\'altezza','Guida alla lettura'];
const gl=k=>`<p style="margin:0 0 6px"><a class="gl" onclick="goG(${k})">Come leggere questa scheda →</a></p>`;
const sel=(id,arr,i,fn)=>`<div><label>${id}</label><select onchange="${fn}(this.value)">${arr.map((x,k)=>`<option value="${k}" ${k==i?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>`;
// ---- grafici SVG
function line(series,o){ // series:[{x,y,c,w}], o:{W,H,xl,yl,log,ylim,hl:[{y,t}],pts:[{x,y,c}],band:{x,lo,hi}}
  const W=o.W||900,H=o.H||260,m={l:50,r:14,t:10,b:34};let xs=series.flatMap(s=>s.x),ys=series.flatMap(s=>s.y);
  const f=o.log?Math.log10:(v=>v);let x0=o.xlim?o.xlim[0]:Math.max(0,Math.floor(Math.min(...xs))),x1=o.xlim?o.xlim[1]:Math.ceil(Math.max(...xs));
  let y0=o.ylim?o.ylim[0]:Math.min(...ys.map(f)),y1=o.ylim?o.ylim[1]:Math.max(...ys.map(f));if(y0==y1){y0-=1;y1+=1}
  if(o.log&&!o.ylim){y0=Math.floor(y0);y1=Math.ceil(y1)}
  const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r),Y=v=>H-m.b-(f(v)-y0)/(y1-y0)*(H-m.t-m.b);
  let g='';const nt=5;
  if(o.log){for(let e=y0;e<=y1;e++){const y=H-m.b-(e-y0)/(y1-y0)*(H-m.t-m.b);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${Math.pow(10,e)}</text>`}}
  else{for(let k=0;k<=nt;k++){const v=y0+(y1-y0)*k/nt,y=H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${fmt(v,Math.abs(y1-y0)<3?2:0)}</text>`}}
  if(!o.nox)for(let k=0;k<=nt;k++){const v=x0+(x1-x0)*k/nt;g+=`<text x="${X(v)}" y="${H-m.b+16}" text-anchor="middle">${fmt(v,0)}</text>`}
  g+=`<text x="${(W+m.l)/2}" y="${H-4}" text-anchor="middle">${o.xl||''}</text>`;
  if(o.yl)g+=`<text transform="translate(12 ${H/2}) rotate(-90)" text-anchor="middle">${o.yl}</text>`;
  if(o.band){const b=o.band;g+=`<path d="M${b.x.map((v,k)=>X(v)+','+Y(b.hi[k])).join('L')}L${b.x.slice().reverse().map((v,k)=>X(v)+','+Y(b.lo[b.x.length-1-k])).join('L')}Z" fill="rgba(42,120,214,.15)"/>`}
  (o.hl||[]).forEach(h=>{g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="${h.c||'var(--fg)'}" stroke-dasharray="${h.d||'3 3'}"/><text x="${W-m.r-4}" y="${Y(h.y)-4}" text-anchor="end">${h.t||''}</text>`});
  series.forEach(s=>{g+=`<path d="M${s.x.map((v,k)=>X(v).toFixed(1)+','+Y(s.y[k]).toFixed(1)).join('L')}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.8}"/>`});
  (o.pts||[]).forEach(p=>{g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="${p.c}" stroke="#fff" stroke-width="2"/>`});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`}
function bars(items,o){ // items:[{t,v,c}] orizzontali
  const W=900,rh=26,H=items.length*rh+24,lm=o.lm||210,mx=Math.max(...items.map(i=>Math.abs(i.v)),1e-9),mn=Math.min(0,...items.map(i=>i.v)),mxv=Math.max(0,...items.map(i=>i.v));
  const X=v=>lm+(v-mn)/(mxv-mn||1)*(W-lm-20);let g='';
  items.forEach((it,k)=>{const y=k*rh+6,a=X(Math.min(0,it.v)),b=X(Math.max(0,it.v));g+=`<text x="${lm-8}" y="${y+15}" text-anchor="end">${esc(it.t)}</text><rect x="${a}" y="${y}" width="${Math.max(b-a,1)}" height="${rh-8}" fill="${it.c}"/>`});
  g+=`<line x1="${X(0)}" x2="${X(0)}" y1="0" y2="${H-18}" stroke="var(--fg)"/>`;return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`}
function colbars(lbl,vals,o){const W=450,H=240,m={l:40,b:30,t:16},n=lbl.length,bw=(W-m.l-10)/n*.7;let g='';
  for(let k=0;k<=4;k++){const v=k/4,y=H-m.b-v*(H-m.b-m.t);g+=`<line x1="${m.l}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${m.l-5}" y="${y+4}" text-anchor="end">${fmt(v,2)}</text>`}
  vals.forEach((v,k)=>{const x=m.l+(k+.15)*(W-m.l-10)/n,h=v*(H-m.b-m.t);g+=`<rect x="${x}" y="${H-m.b-h}" width="${bw}" height="${h}" fill="${k==n-1?C.b:C.g}"/><text x="${x+bw/2}" y="${H-10}" text-anchor="middle">${lbl[k]}</text>`});
  const y=H-m.b-.95*(H-m.b-m.t);g+=`<line x1="${m.l}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--fg)" stroke-dasharray="3 3"/>`;return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`}
// ---- pagine
function p0(){const k=D.kpi,ic=D.ic,s=D.serie,gg=D.gantt;
  const gW=900,gH=90,tmax=Math.max(...gg.map(x=>x.t0+x.dur)),gx=v=>40+v/tmax*(gW-60);
  const gs=gg.map(x=>`<rect x="${gx(x.t0)}" y="14" width="${Math.max(gx(x.t0+x.dur)-gx(x.t0)-2,1)}" height="40" fill="${C.b}"><title>${x.n} unità · ${x.kg} kg · ${fmt(x.dur*24,0)} h</title></rect><text x="${gx(x.t0)+4}" y="38" style="fill:#fff">${x.n}u</text>`).join('')+[0,10,20,30,40,50,60].filter(t=>t<=tmax).map(t=>`<text x="${gx(t)}" y="74" text-anchor="middle">${t}</text>`).join('');
  $('s0').innerHTML=`<h2>Stato del reparto</h2>${gl(0)}<p>${badge('S')} Simulatore a eventi discreti (replica di 60 settimane, caso base). Sensibilità e scenari dai Passi 4a e 4d.</p>
  <div class="cards">${card('Unità rilasciate / settimana',fmt(k.throughput_sett),'± '+fmt(ic.throughput_sett))}${card('Tempo di attraversamento',fmt(k.lt_medio_gg)+' gg','p90 '+fmt(k.lt_p90_gg,0)+' gg')}${card('Unità in lavorazione (WIP)',fmt(k.wip_medio))}${card('Utilizzo autoclave',fmt(100*k.ut_autoclave,0)+'%','collo di bottiglia')}${card('Utilizzo avvolgitrici / pressa',fmt(100*k.ut_avvolgitrici,0)+'% / '+fmt(100*k.ut_pressa,0)+'%')}</div>
  <b>WIP e code (media giornaliera)</b>
  ${line([{x:s.giorno,y:s.wip,c:C.b},{x:s.giorno,y:s.q_pool,c:C.a},{x:s.giorno,y:s.q_avv,c:C.q}],{xl:'Giorno simulato (dopo il riscaldamento)',yl:'Unità',H:280})}
  <div class="leg"><span><i style="background:${C.b}"></i>Unità in lavorazione</span><span><i style="background:${C.a}"></i>Coda in attesa di autoclave</span><span><i style="background:${C.q}"></i>Coda avvolgitrici</span></div>
  <b>Carichi in autoclave (una autoclave: nessuna sovrapposizione)</b><svg viewBox="0 0 ${gW} ${gH}">${gs}<text x="${gW/2}" y="${gH-2}" text-anchor="middle">Giorni (8 settimane simulate)</text></svg>
  <h2>Scenari sulla durata del vuoto finale (Passo 4d)</h2><table><tr><th>Scenario</th><th>Durata carico (h)</th><th>Attraversamento (gg)</th><th>Utilizzo autoclave</th><th>Coda autoclave</th><th>Rischio aggiuntivo non conformità</th></tr>
  ${D.scen.map(r=>`<tr><td>${esc(r[0])}</td><td>${fmt(r[1],2)}</td><td>${fmt(r[2],2)}</td><td>${fmt(100*r[3],1)}%</td><td>${fmt(r[4],2)}</td><td>${fmt(100*r[5],1)} pp</td></tr>`).join('')}</table>`}
let ia=0;
function p1(){const x=D.auto[ia],c=x.curva;
  $('s1').innerHTML=`<h2>Ciclo di autoclave con allarme</h2>${gl(1)}<div class="row">${sel('Ciclo',D.auto,ia,'setA')}</div>${badge(x.prov)}
  <b> Temperatura media delle sonde (°C)</b>${line([{x:c.h,y:c.T,c:C.b}],{xl:"Ore dall'avvio",H:200})}
  <b>Pressione (mbar, scala logaritmica)</b>${line([{x:c.h,y:c.P,c:C.a}],{xl:"Ore dall'avvio",H:200,log:1})}
  <div class="cards">${card('Durata',fmt(x.durata,0)+' h')}${card('Punteggio di anomalia',sc(x.mahal),'soglia '+fmt(D.soglia_ad,1))}${card('Segnalazione',x.allarme?'ANOMALO':'regolare')}</div>
  <div class="msg ${x.allarme?'ko':'ok'}">${esc(x.esito)}</div>
  ${x.prov==='R'?'<div class="msg wa">Per i cicli reali il modello, addestrato su cicli simulati, segnala tutti i cicli (scarto simulato-reale, v. Passo 4c): si considerino il punteggio relativo e la graduatoria, non l\'allarme.</div>':''}
  <b>Perché</b>: variabili che si scostano di più dal comportamento dei cicli regolari<ul>${x.perche_ad.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>${x.nota?`<p class="cap">Nota sul ciclo: ${esc(x.nota)}.</p>`:''}`}
function p2(){const x=D.auto[ia],q=x.q,pf=q[q.length-1][2];
  const lbl=q.map(r=>r[0]),hs=q.map(r=>r[1]),xi=[0,1,2,3],hl=[{y:10,t:'limite 10'}];if(x.h2o_oss!==null)hl.push({y:x.h2o_oss,t:'osservata '+fmt(x.h2o_oss),c:C.a,d:'0'});
  const ymax=Math.max(12,...hs,x.h2o_oss||0)*1.1;
  $('s2').innerHTML=`<h2>Qualità e probabilità di conformità dell'essiccazione</h2>${gl(2)}<div class="row">${sel('Ciclo',D.auto,ia,'setA')}</div>${badge(x.prov)}
  <div class="row"><div><b>Acqua estratta prevista (g/h/t)</b>${line([{x:xi,y:hs,c:C.b,w:2.2}],{W:450,H:240,xlim:[0,3],ylim:[0,ymax],nox:1,hl:hl,pts:xi.map(k=>({x:k,y:hs[k],c:C.b})),xl:lbl.join('  ·  ')})}</div>
  <div><b>Probabilità di essiccazione conforme</b>${colbars(lbl,q.map(r=>r[2]))}</div></div>
  <div class="msg ${pf>=.95?'ok':pf>=.8?'wa':'ko'}">A fine ciclo: acqua estratta prevista ${fmt(hs[3])} g/h/t; probabilità di essiccazione conforme ${fmt(100*pf,0)}%.</div>
  ${x.troncata?'<div class="msg wa">Ciclo incompleto (curva troncata): la previsione a fine ciclo non è significativa.</div>':''}
  <b>Perché</b> (contributi alla previsione a fine ciclo)<ul>${x.perche_q.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
  <b>Contributi SHAP</b> <span class="cap">(arancio: più umidità residua; blu: meno)</span>${bars(x.shap.map(s=>({t:s[0],v:s[1],c:s[1]>0?C.a:C.b})).reverse(),{lm:260})}
  <p class="cap">L'allerta precoce migliora con l'avanzare del ciclo: a 24 h la previsione è poco informativa (Passo 4c). Sui dati simulati le prestazioni sono ottimistiche per costruzione.</p>`}
let kc=Object.keys(D.classi),peso=3000,va=18,pol='0.95|n';
function cls(){return kc[peso<1900?0:peso<4500?1:2]}
function p3(){const nm=cls(),g=D.classi[nm],pf=v=>{const V=g.V;if(v<=V[0])return g.P[0];for(let k=1;k<V.length;k++)if(v<=V[k])return g.P[k-1]+(g.P[k]-g.P[k-1])*(v-V[k-1])/(V[k]-V[k-1]);return g.P[V.length-1]};
  const vs=Math.max(g.pol[pol],3),rid=Math.max(va-vs,0);
  $('s3').innerHTML=`<h2>Raccomandazione sulla durata del vuoto finale</h2>${gl(3)}<p>${badge('R')} Modello costruito sul registro reale dei carichi (49 carichi, Passo 4d): correlazione osservata, da validare in reparto.</p>
  <div class="row"><div><label>Peso del carico (kg)</label><input type="number" value="${peso}" min="300" max="8000" step="100" onchange="peso=+this.value;p3()"></div>
  <div><label>Ore di vuoto finale previste (attuale)</label><input type="number" value="${va}" min="3" max="80" step="0.5" onchange="va=+this.value;p3()"></div>
  <div><label>Politica</label><select onchange="pol=this.value;p3()"><option value="0.95|n" ${pol=='0.95|n'?'selected':''}>P ≥ 0,95</option><option value="0.99|n" ${pol=='0.99|n'?'selected':''}>P ≥ 0,99</option><option value="0.95|c" ${pol=='0.95|c'?'selected':''}>Cautelativa P ≥ 0,95 (intervallo 90%)</option><option value="0.99|c" ${pol=='0.99|c'?'selected':''}>Cautelativa P ≥ 0,99 (intervallo 90%)</option></select></div></div>
  <div class="cards">${card('Classe di peso',esc(nm.split(' ')[0]))}${card('Durata minima suggerita',fmt(vs)+' h')}${card('Ore risparmiate',fmt(rid)+' h')}${card('Probabilità di conformità',fmt(100*pf(rid>0?vs:va),0)+'%',rid>0?fmt(100*(pf(vs)-pf(va)),0)+' pp rispetto all\'attuale':'invariata')}</div>
  ${line([{x:g.V,y:g.P,c:C.b,w:2.2}],{xl:'Ore di vuoto finale',yl:'P(acqua estratta < 10 g/h/t)',xlim:[0,60],ylim:[.4,1],band:{x:g.V,lo:g.lo,hi:g.hi},hl:[{y:.95,t:'0,95'}],pts:[{x:va,y:pf(va),c:C.a},{x:vs,y:pf(vs),c:C.q}],H:300})}
  <div class="leg"><span><i style="background:${C.b}"></i>probabilità di conformità (banda: intervallo 90%)</span><span><i style="background:${C.a}"></i>durata attuale</span><span><i style="background:${C.q}"></i>durata suggerita</span></div>
  <div class="msg ${rid>0?'in':'ok'}">${rid>0?`Con ${fmt(vs)} h di vuoto finale invece di ${fmt(va)} h si risparmiano circa ${fmt(rid,0)} h di autoclave; la probabilità di essiccazione conforme passa da ${fmt(100*pf(va),0)}% a ${fmt(100*pf(vs),0)}%.`:'La durata prevista è già pari o inferiore a quella suggerita: nessuna riduzione proponibile (il modello non propone di allungare).'}</div>`}
let ip=0;
function p4(){const x=D.pr[ip];
  $('s4').innerHTML=`<h2>Pressatura e verifica dell'altezza</h2>${gl(4)}<div class="row">${sel('Ciclo di pressa',D.pr,ip,'setP')}</div>${badge('R')}
  <div class="cards">${card('Forza di fine pressata',fmt(x.forza,0)+' t')}${card('Tempo di ciclo',fmt(x.tempo,0)+' s')}${card('Differenza tra le quote',fmt(x.dq,2)+' mm')}${card('Segnalazione modello',x.allarme_mod?'ANOMALO':'regolare')}${card('Probabilità di conformità',fmt(100*x.p,0)+'%')}</div>
  <div class="msg ${x.allarme_mod?'ko':'ok'}">Il modello ${x.allarme_mod?'segnala':'non segnala'} un ciclo anomalo (punteggio ${fmt(x.mahal)}, soglia ${fmt(x.soglia)}); allarme registrato dalla macchina: ${x.allarme_mac?'sì':'no'}.</div>
  <h2>Verifica dell'altezza dell'avvolgimento</h2>
  ${x.alt!==null?`<div class="cards">${card('Altezza misurata (ipotesi di calcolo)',fmt(x.alt,0)+' mm')}${card('Altezza nominale',fmt(x.nom,0)+' mm',(x.scarto>0?'+':'')+fmt(x.scarto,0)+' mm')}</div><b>Scarto dal nominale (mm)</b>${bars([{t:'',v:x.scarto,c:x.scarto<0?C.a:C.b}],{lm:20})}`:''}
  <div class="msg in">${esc(x.msg)}</div>
